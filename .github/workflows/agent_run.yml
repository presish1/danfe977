on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:      # Allows manual trigger

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push changes to log/queue
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install requests

    - name: Run agent script
      env:
        MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
      run: python autonomous_agent.py

    - name: Commit and push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add content_queue.json agent_log.txt
        # Only commit if there are changes
        git diff --quiet && git diff --staged --quiet || (git commit -m "Agent activity [skip ci]" && git push)
